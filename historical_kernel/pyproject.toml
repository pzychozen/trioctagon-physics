[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trioctagon-historical-kernel"
version = "0.1.0"
description = "Independent Historical TORMENT mathematical reference kernel"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_SCOPE.md"]
dependencies = ["numpy==2.4.4", "trioctagon-historical-protocol==0.1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["trioctagon_historical_kernel"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
