[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "trioctagon-physics"
dynamic = ["version"]
description = "Certified mathematical kernel with explicit dynamics, geometry and provenance"
readme = "kernel_physics/README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE_SCOPE.md"]
authors = [{name = "Hilmir Frímann Halldórsson"}]
dependencies = ["numpy==2.4.4", "sympy==1.14.0", "mpmath==1.3.0"]

[project.urls]
Source = "https://github.com/pzychozen/trioctagon-physics"

[tool.setuptools]
packages = ["kernel_physics"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "kernel_physics.__version__"}

[tool.setuptools.package-data]
kernel_physics = ["_distribution_provenance.json"]
