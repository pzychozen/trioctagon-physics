name: Analysis distribution certification

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - '.github/workflows/analysis-distribution.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-python311:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
      - name: Acquire hashed tooling and exact Core loader test artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          python -I -B analysis/tools/certify_distribution.py --acquire
          --source "$env:GITHUB_WORKSPACE" --workspace "$env:RUNNER_TEMP/analysis-certification"
      - name: Build and certify isolated installed analysis distribution offline
        shell: pwsh
        run: >-
          python -I -B analysis/tools/certify_distribution.py --certify
          --source "$env:GITHUB_WORKSPACE" --workspace "$env:RUNNER_TEMP/analysis-certification"
      - name: Retain exact wheel and distribution certification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: analysis-distribution-${{ github.sha }}
          path: |
            ${{ runner.temp }}/analysis-certification/certified/evidence/
            ${{ runner.temp }}/analysis-certification/acquisition.json
            ${{ runner.temp }}/analysis-certification/acquisition.log
          if-no-files-found: error
          retention-days: 30
