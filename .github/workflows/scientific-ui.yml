name: Scientific UI certification

on:
  push:
    branches: [main]
    paths:
      - 'apps/scientific_ui/**'
      - '.github/workflows/scientific-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-windows-ui:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Use affected CPython 3.11.15 Windows runtime for the access regression
        shell: pwsh
        run: |
          $runtime = "$env:RUNNER_TEMP/export-python"
          & "$env:CONDA/Scripts/conda.exe" create --yes --prefix $runtime --override-channels --channel https://repo.anaconda.com/pkgs/main python=3.11.15=h1044e36_0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $identity = Get-Content "$runtime/conda-meta/python-3.11.15-h1044e36_0.json" -Raw | ConvertFrom-Json
          if ($identity.sha256 -ne 'ecf46bcdd6413dadd376746c828c923a1d25a165690c0dbc05df80c5a9a3ae17') { throw 'Unexpected Python runtime package' }
          "$runtime" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$runtime/Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "$runtime/Library/bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/scientific-ui" | Out-Null
          Copy-Item "$runtime/conda-meta/python-3.11.15-h1044e36_0.json" "$env:RUNNER_TEMP/scientific-ui/python-runtime.json"
      - name: Acquire exact Core, analysis, Historical protocol and hashed wheels
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: >-
          python -B apps/scientific_ui/tests/test_install_launch.py --acquire
          --source "$env:GITHUB_WORKSPACE" --workspace "$env:RUNNER_TEMP/scientific-ui"
      - name: Certify source and installed axial UI, exact K pairing and protocol regressions
        shell: pwsh
        run: >-
          python -B apps/scientific_ui/tests/test_install_launch.py --certify
          --source "$env:GITHUB_WORKSPACE" --workspace "$env:RUNNER_TEMP/scientific-ui"
      - name: Require clean checkout
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (git status --porcelain) { throw 'Certification changed the checkout' }
      - name: Retain companion application evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scientific-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scientific-ui/c-*/evidence/
            ${{ runner.temp }}/scientific-ui/c-*/dist/*.whl
            ${{ runner.temp }}/scientific-ui/*-inventory-certification.json
            ${{ runner.temp }}/scientific-ui/analysis-acquisition.json
            ${{ runner.temp }}/scientific-ui/analysis-wheelhouse/*.whl
            ${{ runner.temp }}/scientific-ui/historical-acquisition.json
            ${{ runner.temp }}/scientific-ui/historical-wheelhouse/*.whl
            ${{ runner.temp }}/scientific-ui/acquisition.json
            ${{ runner.temp }}/scientific-ui/latest-certification.json
            ${{ runner.temp }}/scientific-ui/python-runtime.json
          if-no-files-found: error
          retention-days: 30
